name: REUSE compliance

on:
  push:
  pull_request:

jobs:
  reuse-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reuse
        run: pipx install "reuse[charset-normalizer]"
      - name: reuse lint
        run: reuse lint
